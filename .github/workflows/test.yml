on: [push, pull_request]
name: Test
env:
  ZIG_VERSION: 0.15.2

jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-linux-gnu, x86_64-linux-gnu, aarch64-macos]
    runs-on: ubuntu-latest
    needs: [test-x86_64-linux, test-aarch64-macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: test
        run: zig build --summary all -Dtarget=${{ matrix.target }}

  test-x86_64-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: test
        run: zig build test --summary all
        timeout-minutes: 5

      - name: build all benchmarks and examples
        run: zig build -Demit-example -Demit-bench --summary all

  test-aarch64-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: test
        run: zig build test --summary all
        timeout-minutes: 5

      - name: build all benchmarks and examples
        run: zig build -Demit-example -Demit-bench --summary all
